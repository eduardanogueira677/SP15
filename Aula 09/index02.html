<!DOCTYPE html>
<html lang="pt-br">

    <head>
        <title>Conteúdo Aula 09 - HTML</title>
    </head>

    <body>

        <h1>Definindo imagens no HTML</h1>
        <img src="img/image.png" alt="Gatinhos" width="300" height="170">

        <h3>Definindo altura e largura de imagem com o CSS</h3>
        <img src="img/image.png" alt="Gatinhos" style="width:300px; height:170px">

    <hr>

        <h3>Utilizando imagens dinâmicas no HTML</h3>
        <img src="img/cute-cat.gif" alt="Gatinho" style="width:300px; height:170px">

    <hr>

        <h3>Utilizando imagem flutuante</h3>
        <p>
            <img src="img/cute-cat.gif" style="width: 50px;height: 100px;float: right;"> 
            somente a dor coletiva gera união
        </p>
        
    </body>
</html>
