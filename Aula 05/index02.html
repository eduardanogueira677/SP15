<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <title>Aula 05</title>
</head>

<body>
    <h1>Definindo Estilon no HTML:</h1>

    <p style="color: orangered;">Eu sou laranja</p>
    <p style="color:blue;">Eu sou azul</p>
    <p style="font-size: 30px; font-weight: bold;">Eu estou em destaque</p>

    <hr>

    <h3>Definindo Cores de fundo e elementos no HTML</h3>
    <p style="background-color: rgb(100, 0, 100);">Eu sou um parágrafo</p>
    <p style="background-color: purple;">Eu sou outro parágrafo</p>

    <hr> 

     <p style="font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;">Eu sou um paragrafo.</p>
    <p style="font-family: monospace;">Eu sou outro parágrafo</p>

    <hr>

    <h1>Alinhando tetxo do HTML</h1>
    <h2 style="text-align:center;">Isso é um título h2</h2>
    <p style="text-align:center;">Isso é um parágrafo.</p>

</body>

</html>
