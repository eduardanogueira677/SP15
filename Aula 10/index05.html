<!DOCTYPE html>
<html lang="pt-br">
<head>
  
    <title>Conteúdo Aula 10 - HTML</title>
</head>
<body>
    <h1>Definindo listas no HTML</h1>

    <h3>Exemplo de Lista Não Ordenada</h3>

    <ul>
        <li>Item</li>
        <li>Item</li>
        <li>Item</li>
        <li>Item</li>
        <li>Item</li>
    </ul>

<hr>

    <h3>Exemplo de lista Ordenada</h3>

    <ol>
        <li>Item</li>
        <li>Item</li>
        <li>Item</li>
        <li>Item</li>
        <li>Item</li>
    </ol>
    
        
</body>
</html>
