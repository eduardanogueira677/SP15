<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <title>Aula 07 - Conteúdo HTML</title>

        <link rel="stylesheet" href="style.css">

        <style>

            h2 {
                color: greenyellow;
                font-size: 30px;
                font-family: arial, helvetica, sans-serif; 
            }

            h5 {
                font-family: monospace;
                font-size: 26px;

            }

        </style>

    </head>

    <body>

        <h1>Definindo CSS no HTML</h1>

        <h3 style="color:blueviolet;">Utilizando o CSS inline</h3>

        <p style="color: darkblue;">Eu sou um parágrafo</p>


    <hr>

        <h2 style="color:blueviolet";>Eu sou um h2</h2>

        <h5>Eu sou um h5</h5>
    
    <hr>

        <h3>Utilizando o CSS Externo</h3>

        <h6>eu sou um h6</h6>

        <h4>eu sou um h4</h4>

    <hr>

        <h3>Definindo bordas em elementos no HTML com o CSS</h3>

    <hr>

    <h3>DEfinindo</h3>
    <p>Eu sou um paragrafo</p>
    <p>Eu sou um paragrafo</p>
    <p> eu sou um paragrafo</p>

    </body>

</html>
